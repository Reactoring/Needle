services:
  postgres:
    image: postgres:16-alpine
    container_name: vinyl-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-vinyl}
      POSTGRES_USER: ${DATABASE_USERNAME:-strapi}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-strapi}
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-strapi} -d ${DATABASE_NAME:-vinyl}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
